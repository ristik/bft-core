[package]
name = "sdk-trustbase-client"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The SDK checkout sits next to this directory (the Dockerfile and test/run_local.sh both lay it out as ../sdk).
unicity-token = { path = "../sdk", default-features = false, features = ["std", "client", "http", "file-cache"] }
hex = "0.4"
serde_json = "1"

# Standalone: not a member of the SDK's workspace.
[workspace]
