name: testnet-rehearsal
# The container package, built from pins.json and run on a hosted runner: deploy/testnet/rehearse.py. Evidence of the PACKAGE only (TN-1 #432/#433/#434/#435),
# never of the host: nothing here measures capacity, DNS/TLS, real hCaptcha or a second operator. No third-party service is contacted (the faucet signer, which
# verifies hCaptcha, is not started). Manual: it builds ureth from source, which takes the better part of an hour.
on:
  pull_request:
    # a change to the package (it is long, but the package changes rarely and this is the only run of it as containers)
    paths: ['deploy/testnet/**', '.github/workflows/testnet-rehearsal.yml']
  workflow_dispatch:
    inputs:
      stages:
        description: 'rehearse.py stages, comma separated (default: all that exist)'
        required: false
        default: ''
      pos_stages:
        description: 'PoS-only run: rehearse.py PoS-profile stages (e.g. up,identity,first-tx,pos-smoke,pos-election,pos-proposal; the joiner: up,identity,first-tx,pos-smoke,pos-joiner,pos-election,pos-proposal,pos-propose,pos-install,pos-advance,pos-join-signs,pos-restart,pos-join-heavy, on a fresh generation, in the join step below); skips the PoA rehearsal. Opt-in, not in the default list (bft-core #843): pos-crash, pos-crash-ureth, pos-crash-shard, pos-crash-root, pos-crash-ureth-shard (after pos-recreate), pos-crash-e2 (after pos-advance), pos-crash-e1 (after pos-smoke)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: testnet-rehearsal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rehearse:
    # ubuntu-22.04 (glibc 2.35), not -latest (2.39): a binary needs a glibc no newer than the runtime image's (bookworm, 2.36). The first run built on 2.39 and
    # build-images.py's own --help check in the runtime image refused it, as the package README says (build on Debian 12 or older).
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (the ureth release build is large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - id: pins
        run: |
          python3 - <<'E' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('deploy/testnet/pins.json'))
          for k in ('bft', 'ureth', 'aggregator-go', 'contracts'):
              print(f"{k.replace('-', '_')}={p[k]}")
          E
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pins.outputs.bft }}
          path: pinned-bft
      - uses: actions/checkout@v4
        with:
          repository: ristik/ureth
          ref: ${{ steps.pins.outputs.ureth }}
          path: pinned-ureth
      - uses: actions/checkout@v4
        with:
          repository: ristik/aggregator-go
          ref: ${{ steps.pins.outputs.aggregator_go }}
          path: pinned-aggregator-go
      - uses: actions/checkout@v4
        with:
          repository: ristik/unicity-pos-contracts
          ref: ${{ steps.pins.outputs.contracts }}
          path: pinned-contracts
          submodules: recursive   # the PoS profile's genesis is built from a clean checkout at the pin (generate.py refuses any other)
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libssl-dev pkg-config protobuf-compiler
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1   # cast: offline signing of the rehearsal's transactions
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            pinned-ureth
      - name: Build the images from the pinned sources (build-images.py builds each binary and checks the source pin and a clean tree)
        run: python3 deploy/testnet/build-images.py --bft-source pinned-bft --ureth-source pinned-ureth --aggregator-go-source pinned-aggregator-go
      - run: go build -o /tmp/tn-keygen ./deploy/testnet/keygen
      - run: go build -C pinned-bft -o /tmp/tn-b1genesis ./scripts/b1genesis
      - run: go build -C pinned-bft -o /tmp/tn-h4pin ./scripts/h4-restore-pin   # the PoS join restores the joiner's shard node from a survivor's archive
      - name: Generate a generation (authorities start here and stay live)
        run: |
          umask 077
          echo rehearsal-not-a-real-secret > /tmp/captcha-secret
          sudo -E env "PATH=$PATH" python3 deploy/testnet/generate.py --out /srv/tn-rehearsal-1 --validators 4 --chain-id 31337 \
            --ubft pinned-bft/build/ubft --b1genesis /tmp/tn-b1genesis --keygen /tmp/tn-keygen \
            --captcha-sitekey rehearsal-sitekey --captcha-secret-file /tmp/captcha-secret
      - name: Rehearse
        if: ${{ inputs.pos_stages == '' }}
        env:
          STAGES: ${{ inputs.stages }}
        run: |
          sudo -E env "PATH=$PATH" python3 deploy/testnet/rehearse.py --generation /srv/tn-rehearsal-1 --evidence "$RUNNER_TEMP/evidence" \
            --reset-out /srv/tn-rehearsal-2 --reset-ubft pinned-bft/build/ubft --reset-b1genesis /tmp/tn-b1genesis --reset-keygen /tmp/tn-keygen \
            --reset-captcha-sitekey rehearsal-sitekey --reset-captcha-secret-file /tmp/captcha-secret ${STAGES:+--stages "$STAGES"}
      - name: PoS profile, generation (the PoA generation is stopped first, the host ports are the same)
        if: ${{ inputs.stages == '' }}
        run: |
          for d in /srv/tn-rehearsal-2 /srv/tn-rehearsal-1-restored /srv/tn-rehearsal-1; do
            if sudo test -f "$d/compose.yaml"; then sudo docker compose -f "$d/compose.yaml" down; fi
          done
          umask 077
          sudo -E env "PATH=$PATH" python3 deploy/testnet/generate.py --out /srv/tn-rehearsal-pos --validators 4 --chain-id 31337 \
            --ubft pinned-bft/build/ubft --b1genesis /tmp/tn-b1genesis --keygen /tmp/tn-keygen \
            --captcha-sitekey rehearsal-sitekey --captcha-secret-file /tmp/captcha-secret \
            --pos --pos-contracts pinned-contracts
      - name: PoS profile, rehearse (first start, the 5a smoke, owner keys, the reward pool, the election, the handoff proposal)
        if: ${{ inputs.stages == '' }}
        env:
          POS_STAGES: ${{ inputs.pos_stages }}
        run: |
          sudo -E env "PATH=$PATH" python3 deploy/testnet/rehearse.py --generation /srv/tn-rehearsal-pos --evidence "$RUNNER_TEMP/evidence-pos" \
            --ubft pinned-bft/build/ubft --restore-pin /tmp/tn-h4pin --stages "${POS_STAGES:-up,identity,first-tx,pos-smoke,pos-observe,pos-rewards,pos-election,pos-proposal,pos-abort,pos-propose,pos-too-late,pos-install,pos-advance,pos-restart,pos-stale,pos-handoff-2,pos-restart-2,pos-recreate,pos-owner}"
      - name: PoS profile, resources and logs
        if: always() && inputs.stages == ''
        run: |
          mkdir -p "$RUNNER_TEMP/evidence-pos"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence-pos" || true
          if sudo test -f /srv/tn-rehearsal-pos/compose.yaml; then
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.PIDs}}' > "$RUNNER_TEMP/evidence-pos/docker-stats.txt" || true
            sudo bash -c "cd /srv/tn-rehearsal-pos && F='-f compose.yaml'; [ -f compose.joiner.json ] && F=\"\$F -f compose.joiner.json\"; docker compose \$F ps -a > '$RUNNER_TEMP/evidence-pos/compose-ps.txt' && docker compose \$F logs --no-color --timestamps --tail 600 > '$RUNNER_TEMP/evidence-pos/compose-logs.txt'" || true
            sudo cp /srv/tn-rehearsal-pos/manifest.json "$RUNNER_TEMP/evidence-pos/manifest.json" || true
            sudo cp -r /srv/tn-rehearsal-pos/network "$RUNNER_TEMP/evidence-pos/network" || true   # public material only: no key is ever in network/
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence-pos" || true
          fi
      - name: PoS join profile, generation (a fresh PoS generation, the main one is stopped first, the host ports are the same)
        if: ${{ inputs.stages == '' && inputs.pos_stages == '' }}
        run: |
          if sudo test -f /srv/tn-rehearsal-pos/compose.yaml; then sudo docker compose -f /srv/tn-rehearsal-pos/compose.yaml down; fi
          umask 077
          sudo -E env "PATH=$PATH" python3 deploy/testnet/generate.py --out /srv/tn-rehearsal-join --validators 4 --chain-id 31337 \
            --ubft pinned-bft/build/ubft --b1genesis /tmp/tn-b1genesis --keygen /tmp/tn-keygen \
            --captcha-sitekey rehearsal-sitekey --captcha-secret-file /tmp/captcha-secret \
            --pos --pos-contracts pinned-contracts
      - name: PoS join profile, rehearse (a fifth entity joins - register, bond, delegate, election with five, handoff to five, it signs, restarts)
        if: ${{ inputs.stages == '' && inputs.pos_stages == '' }}
        run: |
          sudo -E env "PATH=$PATH" python3 deploy/testnet/rehearse.py --generation /srv/tn-rehearsal-join --evidence "$RUNNER_TEMP/evidence-join" \
            --ubft pinned-bft/build/ubft --restore-pin /tmp/tn-h4pin \
            --stages "up,identity,first-tx,pos-smoke,pos-joiner,pos-election,pos-proposal,pos-propose,pos-install,pos-advance,pos-join-signs,pos-restart,pos-join-heavy"
      - name: PoS join profile, logs
        if: always() && inputs.stages == '' && inputs.pos_stages == ''
        run: |
          mkdir -p "$RUNNER_TEMP/evidence-join"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence-join" || true
          if sudo test -f /srv/tn-rehearsal-join/compose.yaml; then
            sudo bash -c "cd /srv/tn-rehearsal-join && F='-f compose.yaml'; [ -f compose.joiner.json ] && F=\"\$F -f compose.joiner.json\"; docker compose \$F ps -a > '$RUNNER_TEMP/evidence-join/compose-ps.txt' && docker compose \$F logs --no-color --timestamps --tail 600 > '$RUNNER_TEMP/evidence-join/compose-logs.txt'" || true
            sudo cp -r /srv/tn-rehearsal-join/network "$RUNNER_TEMP/evidence-join/network" || true   # public material only
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence-join" || true
          fi
      - name: Resources and logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence"   # the rehearsal ran as root
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.PIDs}}' > "$RUNNER_TEMP/evidence/docker-stats.txt" || true
          df -h / > "$RUNNER_TEMP/evidence/df.txt" || true
          # the generation that is live now: the reset's, else the restored one, else the original
          G=$(for d in /srv/tn-rehearsal-2 /srv/tn-rehearsal-1-restored /srv/tn-rehearsal-1; do sudo test -f "$d/compose.yaml" && { echo "$d"; break; }; done)
          sudo bash -c "cd '$G' && docker compose ps -a > '$RUNNER_TEMP/evidence/compose-ps.txt' && docker compose logs --no-color --timestamps --tail 400 > '$RUNNER_TEMP/evidence/compose-logs.txt'" || true
          sudo cp "$G/manifest.json" "$RUNNER_TEMP/evidence/manifest.json" || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence" || true
          cp deploy/testnet/artifacts/images.json "$RUNNER_TEMP/evidence/images.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testnet-rehearsal-evidence
          path: ${{ runner.temp }}/evidence
      - uses: actions/upload-artifact@v4
        if: always() && inputs.stages == '' && inputs.pos_stages == ''
        with:
          name: testnet-rehearsal-join-evidence
          path: ${{ runner.temp }}/evidence-join
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && inputs.stages == ''
        with:
          name: testnet-rehearsal-pos-evidence
          path: ${{ runner.temp }}/evidence-pos
          if-no-files-found: ignore
