# The combined UTB/P85/any-age lane on a GitHub-hosted standard runner (docs/ci-lanes.md; briefs/ci-lane-migration-plan.md step 1).
#
# Dispatch: Actions -> ci-lane -> Run workflow (workflow_dispatch). A workflow_dispatch workflow must exist on the default branch to be dispatchable
# (a dispatch with --ref <branch> of a workflow only on that branch answers 404, verified 2026-10-20), so before this file is merged the lane is run by
# pushing a branch named ci-lane-run/<anything>: the push event reads its inputs from scripts/ci/run-inputs.json on that branch. No schedule, no pull_request.
name: ci-lane

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "combined = build and run the lane; build-only = the builds and their provenance checks only"
        type: choice
        options: [combined, build-only]
        default: combined
      inject_failure:
        description: "Harness failure for testing the failure path (honoured only here): none | after-builds | in-lane | in-evidence"
        type: choice
        options: [none, after-builds, in-lane, in-evidence]
        default: none
  push:
    branches: ['ci-lane-run/**']

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.in.outputs.lane }}
      inject: ${{ steps.in.outputs.inject }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: in
        env:
          EVENT: ${{ github.event_name }}
          IN_LANE: ${{ inputs.lane }}
          IN_INJECT: ${{ inputs.inject_failure }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then lane=$IN_LANE; inject=$IN_INJECT
          else lane=$(jq -r .lane scripts/ci/run-inputs.json); inject=$(jq -r .inject_failure scripts/ci/run-inputs.json); fi
          case "$lane" in combined|build-only|ureth-only) ;; *) echo "bad lane $lane" >&2; exit 1 ;; esac
          case "$inject" in none|after-builds|in-lane|in-evidence) ;; *) echo "bad inject_failure $inject" >&2; exit 1 ;; esac
          echo "lane=$lane" >>"$GITHUB_OUTPUT"; echo "inject=$inject" >>"$GITHUB_OUTPUT"
          echo "lane=$lane inject_failure=$inject sha=$GITHUB_SHA"

  build-ureth:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk (the runner's unused toolchains and images)
        run: scripts/ci/prune-runner.sh
      - name: Sample resources
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          nohup scripts/ci/sample-resources.sh "$RUNNER_TEMP/res/ureth-build.tsv" 5 "$RUNNER_TEMP" >/dev/null 2>&1 &
          echo $! >"$RUNNER_TEMP/res/sampler.pid"
          { uname -a; nproc; free -m; df -h; echo "image ${ImageVersion:-?}"; } >"$RUNNER_TEMP/res/runner.txt"
      - name: Build unicity-reth from the pin
        run: scripts/ci/build-ureth.sh "$RUNNER_TEMP/ureth-out" "$RUNNER_TEMP/ureth-build"
      - name: Resources of this job
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/res/sampler.pid")" 2>/dev/null || true
          scripts/ci/summarize-resources.sh "$RUNNER_TEMP/res/ureth-build.tsv" | tee "$RUNNER_TEMP/res/ureth-build.summary.txt"
          df -h / | tail -1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ureth-linux
          path: ${{ runner.temp }}/ureth-out/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resources-build-ureth
          path: ${{ runner.temp }}/res/
          retention-days: 30
