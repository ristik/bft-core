# The combined UTB/P85/any-age lane on GitHub-hosted STANDARD runners (docs/ci-lanes.md; briefs/ci-lane-migration-plan.md step 1).
#
# Dispatch: Actions -> ci-lane -> Run workflow (workflow_dispatch). A workflow_dispatch workflow must exist on the default branch to be dispatchable (a dispatch with
# --ref <branch> of a workflow that only exists on that branch answers HTTP 404; verified 2026-10-20), so before this file is on the default branch the lane is run by
# pushing a branch named ci-lane-run/<anything>: the push event reads its inputs from scripts/ci/run-inputs.json of that branch.
#
# Pull requests (step 3): a pull_request run classifies the change by path (scripts/ci/classify.py, rules scripts/ci/pr-paths.json) and runs only the lane jobs the change can
# affect; docs-only changes run none. `lane-gate` ALWAYS reports (it is the check to require): it passes when everything the plan selected succeeded, and fails when a selected job
# failed, was cancelled or never ran; jobs that were not selected are skipped and never block. The workflow itself is not path-filtered, precisely so that its checks exist on every PR.
#
# Builds publish compact binaries and pinned sources; the run job downloads only those (no Rust target, no Go build cache, no Go/Rust toolchain).
#
# Step 2 (briefs/ci-lane-migration-plan.md section 4): besides the combined lane, the focused P85 over-bound control (overbound), the H6 Abort rehearsal (abort), the T6 rehearsal
# on Linux (t6, its own Foundry v1.8.3 pin) and the targeted ureth crate tests (ureth-targeted). `all-live` is combined + overbound + abort + t6, each on its own VM
# (one devnet per VM). The nightly (schedule) runs all-live and ureth-targeted at the integration branch tip, resolved once in `plan` and recorded; a schedule fires only from the
# default branch's copy of this file (docs/ci-lanes.md).
name: ci-lane

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "combined | overbound | abort | t6 | ureth-targeted | all-live (combined, overbound, abort, t6) | x4-shadow (the declared 90-minute PoA-authoritative shadow observation, manual; not part of all-live or the nightly) | x4-exit (the exit lifecycle on the recovery lane's chain: the joiner's identity requests retirement, the roots order the Retirement, the lots mature and are claimed; manual, ~2.5 h) | x4-rewards (the PoS campaign's reward steps on a small-funded shadow chain, manual) | build-only (the builds and their provenance checks only)"
        type: choice
        options: [combined, overbound, abort, t6, ureth-targeted, all-live, x4-shadow, x4-rewards, x4-exit, build-only]
        default: combined
      inject_failure:
        description: "Harness failure to test the failure path (honoured only by this workflow): none | after-builds | in-lane"
        type: choice
        options: [none, after-builds, in-lane]
        default: none
  push:
    branches: ['ci-lane-run/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [integration/enshrined-evm, main]
  schedule:
    - cron: '17 1 * * *'   # nightly, UTC: all-live + ureth-targeted at the integration tip (only fires once this file is on the default branch)

permissions:
  contents: read

concurrency:
  # a newer push to the same PR supersedes the older run (heavy jobs on a standard runner); other events never cancel each other
  group: ci-lane-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.in.outputs.sha }}
      inject: ${{ steps.in.outputs.inject }}
      lanes: ${{ steps.in.outputs.lanes }}
      t6: ${{ steps.in.outputs.t6 }}
      targeted: ${{ steps.in.outputs.targeted }}
      need_ureth: ${{ steps.in.outputs.need_ureth }}
      need_lane_builds: ${{ steps.in.outputs.need_lane_builds }}
      selftests: ${{ steps.in.outputs.selftests }}
      note: ${{ steps.in.outputs.note }}
    steps:
      # A scheduled or dispatched run tests the tip of integration/enshrined-evm, whichever branch's copy of this file started it (the copy on the default branch `main`
      # is what GitHub runs for those events, and main is not the code under test): the tip is resolved here ONCE, recorded in the job summary, and every later job
      # checks out that SHA. A push of a ci-lane-run/** branch tests that very commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.sha || 'integration/enshrined-evm' }}
          fetch-depth: 0   # a pull request is classified against its base
      - id: in
        env:
          EVENT: ${{ github.event_name }}
          IN_LANE: ${{ inputs.lane }}
          IN_INJECT: ${{ inputs.inject_failure }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          note=; selftests=false
          if [ "$EVENT" = pull_request ]; then
            lane=pr; inject=none
          elif [ "$EVENT" = workflow_dispatch ]; then lane=$IN_LANE; inject=$IN_INJECT
          elif [ "$EVENT" = schedule ]; then lane=nightly; inject=none
          else lane=$(jq -r .lane scripts/ci/run-inputs.json); inject=$(jq -r .inject_failure scripts/ci/run-inputs.json); fi
          case "$lane" in combined|overbound|abort|t6|ureth-targeted|all-live|x4-shadow|x4-rewards|x4-exit|nightly|build-only|pr) ;; *) echo "bad lane $lane" >&2; exit 1 ;; esac
          case "$inject" in none|after-builds|in-lane) ;; *) echo "bad inject_failure $inject" >&2; exit 1 ;; esac
          lanes='[]'; t6=false; targeted=false
          case "$lane" in
            combined|overbound|abort) lanes="[\"$lane\"]" ;;
            x4-shadow) lanes='["x4shadow"]' ;;
            x4-rewards) lanes='["x4rewards"]' ;;
            x4-exit) lanes='["x4exit"]' ;;
            all-live|nightly) lanes='["combined","overbound","abort"]'; t6=true ;;
            t6) t6=true ;;
          esac
          case "$lane" in ureth-targeted|nightly) targeted=true ;; esac
          case "$lane" in nightly|all-live) selftests=true ;; esac
          if [ "$lane" = pr ]; then
            if [ "$PR_DRAFT" = true ]; then
              note="draft pull request: live lanes are not run until it is ready for review"
            else
              # The classifier and its rules are the BASE branch's copies, never the PR's own: a PR cannot narrow what it is judged by (rev3 B2 on #706). If the base has none
              # (the PR that introduces them), the plan fails closed and selects everything.
              mkdir -p "$RUNNER_TEMP/base-ci"
              if git show "$PR_BASE:scripts/ci/classify.py" >"$RUNNER_TEMP/base-ci/classify.py" 2>/dev/null && git show "$PR_BASE:scripts/ci/pr-paths.json" >"$RUNNER_TEMP/base-ci/pr-paths.json" 2>/dev/null; then
                c=$(python3 "$RUNNER_TEMP/base-ci/classify.py" --rules "$RUNNER_TEMP/base-ci/pr-paths.json" --base "$PR_BASE" --head HEAD)
                src="the base branch's classifier"
              else
                c='{"lanes":["combined","overbound","abort"],"t6":true,"targeted":true,"selftests":true,"reason":{"all":"the base branch has no classifier: everything is selected"}}'
                src="no classifier on the base: fail closed"
              fi
              echo "$c ($src)"
              lanes=$(jq -c .lanes <<<"$c"); t6=$(jq -r .t6 <<<"$c"); targeted=$(jq -r .targeted <<<"$c"); selftests=$(jq -r .selftests <<<"$c")
            fi
          fi
          need_lane_builds=false; [ "$lanes" = '[]' ] && [ "$lane" != build-only ] || need_lane_builds=true
          need_ureth=false; [ "$lanes" != '[]' ] || [ "$t6" = true ] || [ "$lane" = build-only ] && need_ureth=true
          sha=$(git rev-parse HEAD)
          { echo "sha=$sha"; echo "inject=$inject"; echo "lanes=$lanes"; echo "t6=$t6"; echo "targeted=$targeted"
            echo "need_ureth=$need_ureth"; echo "need_lane_builds=$need_lane_builds"; echo "selftests=$selftests"; echo "note=$note"; } >>"$GITHUB_OUTPUT"
          echo "lane=$lane inject_failure=$inject lanes=$lanes t6=$t6 targeted=$targeted selftests=$selftests commit under test=$sha"
          { echo "### ci-lane plan"; echo "- event: $EVENT, lane: $lane, inject_failure: $inject"; echo "- commit under test: \`$sha\` ($(git log -1 --format=%s | cut -c1-100))"
            echo "- selected: lanes=$lanes t6=$t6 ureth-targeted=$targeted selftests=$selftests"; [ -z "$note" ] || echo "- $note"
            case "$EVENT" in push|pull_request) ;; *) echo "- resolved once from \`integration/enshrined-evm\`; every job checks out this SHA" ;; esac
            [ "$EVENT" != pull_request ] || { echo "- classifier ($src) over \`git diff $PR_BASE HEAD\`:"; echo '```'; jq -c .reason <<<"$c"; echo '```'; }; } >>"$GITHUB_STEP_SUMMARY"

  build-ureth:
    needs: plan
    if: ${{ needs.plan.outputs.need_ureth == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Free disk (the runner's unused toolchains and images)
        run: scripts/ci/prune-runner.sh
      - name: Sample resources
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          nohup scripts/ci/sample-resources.sh "$RUNNER_TEMP/res/build-ureth.tsv" 5 "$RUNNER_TEMP" >/dev/null 2>&1 &
          echo $! >"$RUNNER_TEMP/res/sampler.pid"
          { uname -a; nproc; free -m; df -h; echo "image ${ImageVersion:-?}"; } >"$RUNNER_TEMP/res/runner.txt"
      - name: Build unicity-reth from the pin
        run: scripts/ci/build-ureth.sh "$RUNNER_TEMP/ureth-out" "$RUNNER_TEMP/ureth-build"
      - name: Resources of this job
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/res/sampler.pid")" 2>/dev/null || true
          scripts/ci/summarize-resources.sh "$RUNNER_TEMP/res/build-ureth.tsv" | tee "$RUNNER_TEMP/res/build-ureth.summary.txt"
          df -h / | tail -1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ureth-linux
          path: ${{ runner.temp }}/ureth-out/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resources-build-ureth
          path: ${{ runner.temp }}/res/
          retention-days: 30

  build-tools:
    needs: plan
    if: ${{ needs.plan.outputs.need_lane_builds == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0   # the aggregator's bft-core pin must be in this checkout's history (utb_agg_pins_ok)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.14'
          cache: false
      - name: Sample resources
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          nohup scripts/ci/sample-resources.sh "$RUNNER_TEMP/res/build-tools.tsv" 5 "$RUNNER_TEMP" >/dev/null 2>&1 &
          echo $! >"$RUNNER_TEMP/res/sampler.pid"
      - name: Build the Go side, the aggregator from its pin, and run the chain-free self-tests
        env:
          AGRE_ROOT: ${{ runner.temp }}/agre-build
        run: |
          mkdir -p "$AGRE_ROOT/builds"
          scripts/ci/build-tools.sh "$RUNNER_TEMP/tools-out"
      - name: Resources of this job
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/res/sampler.pid")" 2>/dev/null || true
          scripts/ci/summarize-resources.sh "$RUNNER_TEMP/res/build-tools.tsv" | tee "$RUNNER_TEMP/res/build-tools.summary.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bft-tools
          path: ${{ runner.temp }}/tools-out/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resources-build-tools
          path: ${{ runner.temp }}/res/
          retention-days: 30

  build-sources:
    needs: plan
    if: ${{ needs.plan.outputs.need_lane_builds == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Sample resources
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          nohup scripts/ci/sample-resources.sh "$RUNNER_TEMP/res/build-sources.tsv" 5 "$RUNNER_TEMP" >/dev/null 2>&1 &
          echo $! >"$RUNNER_TEMP/res/sampler.pid"
      - name: Install the pinned Foundry
        run: |
          scripts/ci/install-foundry.sh
          echo "$HOME/.foundry/bin" >>"$GITHUB_PATH"
      - name: Pinned sources (contracts with its forge build, the NBP driver, the JS SDK)
        run: scripts/ci/prepare-sources.sh "$RUNNER_TEMP/sources-out" "$RUNNER_TEMP/sources-work"
      - name: Resources of this job
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/res/sampler.pid")" 2>/dev/null || true
          scripts/ci/summarize-resources.sh "$RUNNER_TEMP/res/build-sources.tsv" | tee "$RUNNER_TEMP/res/build-sources.summary.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sources
          path: ${{ runner.temp }}/sources-out/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resources-build-sources
          path: ${{ runner.temp }}/res/
          retention-days: 30

  run-lane:
    needs: [plan, build-ureth, build-tools, build-sources]
    if: ${{ needs.plan.outputs.lanes != '[]' }}   # a failed build job fails the run job's prerequisites (no !cancelled override)
    strategy:
      fail-fast: false   # each kind is its own VM and its own verdict
      matrix:
        kind: ${{ fromJSON(needs.plan.outputs.lanes) }}
    name: run-lane (${{ matrix.kind }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.kind == 'x4shadow' && 170 || matrix.kind == 'x4rewards' && 90 || matrix.kind == 'x4exit' && 200 || matrix.kind == 'combined' && 90 || 60 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Machine checks and free disk
        run: |
          set -eu
          for c in docker jq python3 curl git node npm zstd rsync lsof openssl xxd strings; do command -v "$c" >/dev/null || { echo "missing $c" >&2; sudo apt-get update -qq && sudo apt-get install -y -qq "$c" || true; }; done
          scripts/ci/prune-runner.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ureth-linux
          path: ${{ runner.temp }}/artifacts/ureth-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bft-tools
          path: ${{ runner.temp }}/artifacts/tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sources
          path: ${{ runner.temp }}/artifacts/sources
      - name: Sample resources
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          nohup scripts/ci/sample-resources.sh "$RUNNER_TEMP/res/run-lane.tsv" 5 "$RUNNER_TEMP" >/dev/null 2>&1 &
          echo $! >"$RUNNER_TEMP/res/sampler.pid"
          { uname -a; nproc; free -m; df -h; echo "image ${ImageVersion:-?}"; } >"$RUNNER_TEMP/res/runner.txt"
      - name: The lane
        env:
          CI_INJECT_FAILURE: ${{ needs.plan.outputs.inject }}
          CI_LANE_KIND: ${{ matrix.kind }}
          LANE_DEADLINE_MIN: ${{ matrix.kind == 'x4shadow' && '140' || matrix.kind == 'x4rewards' && '70' || matrix.kind == 'x4exit' && '170' || matrix.kind == 'combined' && '70' || '45' }}
        run: scripts/ci/run-lane.sh "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/lane" "$RUNNER_TEMP/lane-out"
      - name: Resources of this job
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/res/sampler.pid")" 2>/dev/null || true
          scripts/ci/summarize-resources.sh "$RUNNER_TEMP/res/run-lane.tsv" | tee "$RUNNER_TEMP/res/run-lane.summary.txt"
      - name: Upload set (the publishable evidence pack, its outer digest, the logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-evidence-${{ matrix.kind }}
          path: ${{ runner.temp }}/lane-out/upload/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resources-run-lane-${{ matrix.kind }}
          path: ${{ runner.temp }}/res/
          retention-days: 30

  run-t6:
    needs: [plan, build-ureth]
    if: ${{ needs.plan.outputs.t6 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      # T6 rebuilds its own helper tools, the four allocation contracts and its own Foundry (v1.8.3) in an isolated checkout: this job needs Go
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.14'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ureth-linux
          path: ${{ runner.temp }}/artifacts/ureth-linux
      - name: Free disk (before the sampler, so the growth it reports is T6's own)
        run: scripts/ci/prune-runner.sh
      - name: Sample resources
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          nohup scripts/ci/sample-resources.sh "$RUNNER_TEMP/res/run-t6.tsv" 5 "$RUNNER_TEMP" >/dev/null 2>&1 &
          echo $! >"$RUNNER_TEMP/res/sampler.pid"
          { uname -a; nproc; free -m; df -h; echo "image ${ImageVersion:-?}"; } >"$RUNNER_TEMP/res/runner.txt"
      - name: T6 rehearsal
        env:
          CI_INJECT_FAILURE: ${{ needs.plan.outputs.inject }}
          T6_DEADLINE_MIN: '105'
        run: scripts/ci/run-t6.sh "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/t6" "$RUNNER_TEMP/t6-out"
      - name: Resources of this job
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/res/sampler.pid")" 2>/dev/null || true
          scripts/ci/summarize-resources.sh "$RUNNER_TEMP/res/run-t6.tsv" | tee "$RUNNER_TEMP/res/run-t6.summary.txt"
      - name: Upload set (the publishable evidence pack, its outer digest, the logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t6-evidence
          path: ${{ runner.temp }}/t6-out/upload/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resources-run-t6
          path: ${{ runner.temp }}/res/
          retention-days: 30

  ureth-targeted:
    needs: plan
    if: ${{ needs.plan.outputs.targeted == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Free disk
        run: scripts/ci/prune-runner.sh
      - name: Sample resources
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          nohup scripts/ci/sample-resources.sh "$RUNNER_TEMP/res/ureth-targeted.tsv" 5 "$RUNNER_TEMP" >/dev/null 2>&1 &
          echo $! >"$RUNNER_TEMP/res/sampler.pid"
          { uname -a; nproc; free -m; df -h; echo "image ${ImageVersion:-?}"; } >"$RUNNER_TEMP/res/runner.txt"
      - name: Targeted ureth tests (the Unicity crates of the pin, not the workspace)
        run: scripts/ci/test-ureth.sh "$RUNNER_TEMP/ureth-test-out" "$RUNNER_TEMP/ureth-test"
      - name: Resources of this job
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/res/sampler.pid")" 2>/dev/null || true
          scripts/ci/summarize-resources.sh "$RUNNER_TEMP/res/ureth-targeted.tsv" | tee "$RUNNER_TEMP/res/ureth-targeted.summary.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ureth-targeted
          path: ${{ runner.temp }}/ureth-test-out/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resources-ureth-targeted
          path: ${{ runner.temp }}/res/
          retention-days: 30

  selftests:
    needs: plan
    if: ${{ needs.plan.outputs.selftests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Chain-free self-tests of the CI scripts (classifier, gate, pins, publisher)
        run: |
          set -euo pipefail
          for c in jq rsync zstd; do command -v "$c" >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq "$c"; }; done
          python3 scripts/ci/classify.py selftest
          scripts/ci/gate.sh selftest
          scripts/ci/check-pins.sh selftest
          scripts/ci/publish-selftest.sh

  lane-gate:
    # ALWAYS reports: the one check to require. Not-selected jobs are skipped and never block; a selected job that failed, was cancelled or never ran fails it.
    needs: [plan, build-ureth, build-tools, build-sources, run-lane, run-t6, ureth-targeted, selftests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha || github.sha }}
          fetch-depth: 0
      - name: Gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_LANES: ${{ needs.plan.outputs.lanes }}
          PLAN_T6: ${{ needs.plan.outputs.t6 }}
          PLAN_TARGETED: ${{ needs.plan.outputs.targeted }}
          PLAN_SELFTESTS: ${{ needs.plan.outputs.selftests }}
          PLAN_NEED_URETH: ${{ needs.plan.outputs.need_ureth }}
          PLAN_NEED_LANE_BUILDS: ${{ needs.plan.outputs.need_lane_builds }}
          PLAN_NOTE: ${{ needs.plan.outputs.note }}
          R_BUILD_URETH: ${{ needs.build-ureth.result }}
          R_BUILD_TOOLS: ${{ needs.build-tools.result }}
          R_BUILD_SOURCES: ${{ needs.build-sources.result }}
          R_RUN_LANE: ${{ needs.run-lane.result }}
          R_RUN_T6: ${{ needs.run-t6.result }}
          R_URETH_TARGETED: ${{ needs.ureth-targeted.result }}
          R_SELFTESTS: ${{ needs.selftests.result }}
        run: |
          set -o pipefail
          # the gate logic is the BASE branch's copy on a pull request (a PR cannot weaken the check that judges it); where the base has none (the PR that introduces it) the PR's own is used
          gate=scripts/ci/gate.sh
          if [ "$EVENT" = pull_request ] && git show "$PR_BASE:scripts/ci/gate.sh" >"$RUNNER_TEMP/gate.sh" 2>/dev/null; then chmod +x "$RUNNER_TEMP/gate.sh"; gate="$RUNNER_TEMP/gate.sh"; echo "gate logic: the base branch's"; else echo "gate logic: this tree's (no base copy)"; fi
          "$gate" | tee -a "$GITHUB_STEP_SUMMARY"
