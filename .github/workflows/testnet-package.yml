name: testnet-package
on:
  pull_request:
    paths: ['deploy/testnet/**', '.github/workflows/testnet-package.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testnet-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guards-and-ceremony:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: docker compose version
      - run: python3 -m unittest discover -s deploy/testnet -p test_package.py -v
        env:
          TN_REQUIRE_COMPOSE: '1'
      - run: python3 -m unittest discover -s deploy/testnet/faucet -v
      - uses: actions/checkout@v4
        with:
          ref: df8434e4c7e24169e583952b095720d78cef9004
          path: pinned-bft
      - run: make -C pinned-bft build
      - run: go build -C pinned-bft -o /tmp/tn-b1genesis ./scripts/b1genesis
      - run: go build -o /tmp/tn-keygen ./deploy/testnet/keygen
      - uses: actions/checkout@v4
        with:
          repository: ristik/aggregator-go
          ref: 86d93f1e9ba067a6d7bfe6103cdd79ccee58424e
          path: pinned-aggregator-go
      # cgo for secp256k1, no rocksdb tag (memory SMT, state in MongoDB), as build-images.py builds it; go.mod's newer toolchain is fetched by GOTOOLCHAIN=auto
      - run: CGO_ENABLED=1 go build -C pinned-aggregator-go -trimpath -o /tmp/tn-aggregator ./cmd/aggregator
      - uses: actions/checkout@v4
        with:
          repository: ristik/unicity-pos-contracts
          ref: ec69d8f05ceebe00783275740ceea052f4c8da70
          path: pinned-contracts
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # the contracts' own CI pin: the registry's runtime bytecode and code hash are protocol surface
          version: v1.8.1
      - run: python3 deploy/testnet/validate-generation.py --ubft pinned-bft/build/ubft --keygen /tmp/tn-keygen --b1genesis /tmp/tn-b1genesis --check-prometheus --aggregator /tmp/tn-aggregator --pos-contracts pinned-contracts
      - run: docker build -f deploy/testnet/Dockerfile.rpc deploy/testnet -t testnet-rpc:test
      - run: docker run --rm --entrypoint python3 testnet-rpc:test -c 'import gateway; assert "eth_sign" not in gateway.PUBLIC'
