name: testnet-bridge
# Rehearse NB2 v1.1 on the container package with the pinned wallet.
on:
  pull_request:
    paths: ['deploy/testnet/bridge/**', 'scripts/dnb-tool/**', 'scripts/nb2-evidence/**', 'nb2ref/**', '.github/workflows/testnet-bridge.yml']
  push:
    branches: ['tnb-rehearsal/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testnet-bridge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rehearse:
    # ubuntu-22.04 (glibc 2.35): the node image's binaries are built on the runner and run on bookworm (testnet-rehearsal.yml)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (the ureth release build is large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - id: pins
        run: |
          python3 - <<'E' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('deploy/testnet/pins.json'))
          for k in ('bft', 'ureth', 'aggregator-go'):
              print(f"{k.replace('-', '_')}={p[k]}")
          b = json.load(open('deploy/testnet/bridge/pins.json'))
          print(f"contracts={b['contracts']}")
          print(f"nbp={b['native-bridge-plugins']}")
          E
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pins.outputs.bft }}
          path: pinned-bft
      - uses: actions/checkout@v4
        with:
          repository: ristik/ureth
          ref: ${{ steps.pins.outputs.ureth }}
          path: pinned-ureth
      - uses: actions/checkout@v4
        with:
          repository: ristik/aggregator-go
          ref: ${{ steps.pins.outputs.aggregator_go }}
          path: pinned-aggregator-go
      - uses: actions/checkout@v4
        with:
          repository: ristik/unicity-pos-contracts
          ref: ${{ steps.pins.outputs.contracts }}
          path: pinned-contracts
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: ristik/native-bridge-plugins
          ref: ${{ steps.pins.outputs.nbp }}
          path: pinned-nbp
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libssl-dev pkg-config protobuf-compiler
      - uses: ./.github/actions/foundry   # Foundry v1.8.1 (digest-pinned archive): cast, offline signing of the rehearsal's transactions
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            pinned-ureth
      - name: Build the node images from the pinned sources
        run: python3 deploy/testnet/build-images.py --bft-source pinned-bft --ureth-source pinned-ureth --aggregator-go-source pinned-aggregator-go
      - name: Build the bridge tools image (dnb-tool from the pinned bft, the node images' pin, contracts and plug-ins at bridge/pins.json)
        run: python3 deploy/testnet/bridge/build-bridge-image.py --bft-source pinned-bft --contracts-source pinned-contracts --nbp-source pinned-nbp
      - name: Pinned reference wallet unit tests
        run: |
          img=$(python3 -c "import sys; sys.path[:0] = ['deploy/testnet/bridge', 'deploy/testnet']; import deploy_bridge; print(deploy_bridge.image())")
          docker run --rm --read-only --network none --tmpfs /tmp -e HOME=/tmp/home "$img" npx --no-install tsx --test wallet/core.test.ts wallet/trust.test.ts
          docker run --rm --read-only --network none --tmpfs /tmp -e HOME=/tmp/home "$img" npx --no-install tsx --test --test-name-pattern "qualified ordinary envelope|ordinary release gas bound" wallet/recovery.test.ts
      - run: go build -o /tmp/tn-keygen ./deploy/testnet/keygen
      - run: go build -C pinned-bft -o /tmp/tn-b1genesis ./scripts/b1genesis
      - name: The Go reference verifier and wallet-evidence tool (nb2ref), from this checkout
        run: go build -o /tmp/nb2-evidence ./scripts/nb2-evidence
      - name: Generate a generation (authorities start here and stay live)
        run: |
          umask 077
          echo rehearsal-not-a-real-secret > /tmp/captcha-secret
          sudo -E env "PATH=$PATH" python3 deploy/testnet/generate.py --first-generation --out /srv/tn-bridge-1 --validators 4 --chain-id 31337 \
            --ubft pinned-bft/build/ubft --b1genesis /tmp/tn-b1genesis --keygen /tmp/tn-keygen --block-interval-ms 0 \
            --captcha-sitekey rehearsal-sitekey --captcha-secret-file /tmp/captcha-secret --utb
      - name: Bring the package up (rehearse.py up, identity)
        run: sudo -E env "PATH=$PATH" python3 deploy/testnet/rehearse.py --generation /srv/tn-bridge-1 --evidence "$RUNNER_TEMP/evidence" --stages up,identity
      - name: Deploy, verify and exercise NB2 v1.1 through the gateway
        run: |
          sudo -E env "PATH=$PATH" python3 deploy/testnet/bridge/nb2/deploy_nb2.py /srv/tn-bridge-1 --nb2-evidence /tmp/nb2-evidence
          sudo -E env "PATH=$PATH" python3 deploy/testnet/bridge/nb2/smoke_nb2.py /srv/tn-bridge-1 --evidence "$RUNNER_TEMP/evidence/nb2"
          sudo cp -R /srv/tn-bridge-1/bridge/nb2/public "$RUNNER_TEMP/evidence/nb2/"
      - name: Resources and logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence"   # the rehearsal ran as root
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.PIDs}}' > "$RUNNER_TEMP/evidence/docker-stats.txt" || true
          df -h / > "$RUNNER_TEMP/evidence/df.txt" || true
          sudo bash -c "cd /srv/tn-bridge-1 && docker compose -f compose.yaml ps -a > '$RUNNER_TEMP/evidence/compose-ps.txt' && docker compose -f compose.yaml logs --no-color --timestamps --tail 400 > '$RUNNER_TEMP/evidence/compose-logs.txt'" || true
          sudo PYTHONDONTWRITEBYTECODE=1 python3 deploy/testnet/redact_evidence.py /srv/tn-bridge-1 "$RUNNER_TEMP/evidence/compose-logs.txt" || sudo bash -c "echo '[log withheld: redaction did not finish]' > '$RUNNER_TEMP/evidence/compose-logs.txt'"
          sudo cp /srv/tn-bridge-1/manifest.json "$RUNNER_TEMP/evidence/manifest.json" || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence" || true
          cp deploy/testnet/artifacts/images.json deploy/testnet/artifacts/bridge-images.json "$RUNNER_TEMP/evidence/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testnet-bridge-evidence
          path: ${{ runner.temp }}/evidence
