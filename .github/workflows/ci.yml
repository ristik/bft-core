name: ci

# F1 (#9) requires PR-triggered CI for the integration branch. Per the owner's 2026-09-06 decision
# this does not enable branch protection or required-check rules — the checks run and are visible on
# every PR, and merging stays a human decision. See docs/design/f1-baseline.md §6.
on:
  push:
  pull_request:
    branches:
      - integration/enshrined-evm
      - main

env:
  GO_VERSION: 1.24
  RUST_VERSION: stable
  RETENTION-DAYS: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build (without FFI)
        run: make build

  build-with-ffi:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rootchain/consensus/zkverifier/sp1-verifier-ffi
            rootchain/consensus/zkverifier/light-client-verifier-ffi
      - name: build (with FFI)
        run: make build-with-ffi
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: vet (without FFI)
        run: go vet ./...
      - name: test (without FFI)
        run: make test
      - name: upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: test-coverage.out
          retention-days: ${{ env.RETENTION-DAYS }}

  test-with-ffi:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rootchain/consensus/zkverifier/sp1-verifier-ffi
            rootchain/consensus/zkverifier/light-client-verifier-ffi
      - name: Build Rust FFI libraries
        run: make build-rust-ffi
      - name: vet (with FFI)
        run: go vet -tags zkverifier_ffi ./...
      - name: test (with FFI)
        run: make test ZKVERIFIER_FFI=1
      - name: upload test coverage (with FFI)
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-ffi
          path: test-coverage.out
          retention-days: ${{ env.RETENTION-DAYS }}

  analyze:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: gosec
        run: make gosec

  # evm-shard-chaos and evm-shard-compose-e2e are the "compose E2E" and live-fault-injection legs
  # of docs/engine-api-adapter-plan.md T1.7 — the `test` job above already covers unit tests, the
  # executortest conformance suite, and the determinism harness (shardnode/determinism_test.go) as
  # part of `go test ./...`; these two exercise the process-based and container-based shard
  # topologies respectively, which `go test` alone doesn't reach. Both run against
  # `--executor fake` only — neither has a reth image to test against; see
  # docs/engine-api-adapter-plan.md §10 and scripts/reth-by-hand.sh.
  #
  # These are NOT real-execution evidence, and F1 (#9) requires that distinction be explicit: the
  # fake executor models no header economics at all, and nothing here drives a real execution
  # client. Two local lanes cover that (docs/design/f1-baseline.md §5.3, §5.5):
  #   scripts/reth-baseline.sh      — stock-client header economics, curl only, no Go adapter
  #   scripts/reth-paired-devnet.sh — the actual integration: `--executor engine-api` against one
  #                                   real reth per validator, which is the lane that says
  #                                   anything about engineapi/
  # Neither is a job here yet. The approved fork now exists (ristik/ureth, pinned in §2), so the
  # blocker is no longer "where would the binary come from" but the Rust build/cache cost, which
  # belongs with the change that first makes the fork differ from upstream. Wiring it in is F3 (#11).
  evm-shard-chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: kill-leader / kill-follower / cold-restart / corrupted-store scenarios
        run: ./scripts/chaos-evm.sh -v 4 -k

      # The intermittent leader-kill stall and the same-partition-round certificate conflict
      # cannot be settled from the truncated snippets in the step log (F1 #9, review 5132493933).
      # Keep the full node logs and persisted state from a failing run so the next occurrence can
      # be analysed instead of re-guessed. -k above stops the script from tearing test-nodes/ down.
      - name: Collect node logs and state on failure
        if: failure()
        run: |
          mkdir -p chaos-artifacts
          for d in test-nodes/*/; do
            name=$(basename "$d")
            mkdir -p "chaos-artifacts/$name"
            # Logs plus the persisted certificate store: the stored UC is half of every
            # conflict comparison and cannot be reconstructed from the log alone.
            # keys.json is excluded on purpose. These are throwaway devnet keys regenerated every
            # run, but publishing signing keys as a build artifact is not a habit worth forming,
            # and nothing in this analysis needs them — node-info.json carries the public identity.
            cp "$d"debug.log "chaos-artifacts/$name/" 2>/dev/null || true
            find "$d" -maxdepth 1 -type f ! -name 'debug.log' ! -name 'pid' ! -name 'keys.json' \
              -exec cp {} "chaos-artifacts/$name/" \; 2>/dev/null || true
          done
          tar czf chaos-artifacts.tar.gz chaos-artifacts
          echo "collected:"; du -sh chaos-artifacts.tar.gz

      - name: Upload chaos failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-failure-evidence
          path: chaos-artifacts.tar.gz
          retention-days: 14

      - name: Stop nodes
        if: always()
        run: ./stop-evm.sh -a || true

  evm-shard-compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the EVM shard topology
        run: docker compose -f docker-compose.evm.yml up --build -d root1 root2 root3 evm1 evm2 evm3 evm4
      - name: Wait for the shard to certify
        run: |
          for i in $(seq 1 24); do
            if docker compose -f docker-compose.evm.yml logs evm1 2>&1 | grep -q 'accepted certificate'; then
              echo "certifying"
              exit 0
            fi
            sleep 5
          done
          echo "no certificate observed within 120s" >&2
          docker compose -f docker-compose.evm.yml logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.evm.yml down -v
