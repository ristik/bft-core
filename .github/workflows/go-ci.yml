name: go-ci

# A new filename leaves legacy ci.yml disabled on old feature branches.
# Go checks run for code changes on the two integration targets, not feature pushes.
# Owner addendum, 2026-10-07: protection may be enabled only after merge and a green integration run.
on:
  push:
    branches:
      - integration/enshrined-evm
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - integration/enshrined-evm
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Metadata-only edits must not cancel an active Go run for this PR.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && '-metadata' || '' }}
  cancel-in-progress: true

# setup-go caches both downloaded modules and Go build outputs, keyed by go.sum.
defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Filter Go paths
    # Retargeting changes the code under test; title/body edits do not.
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.paths.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Filter documentation and briefs
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # Keep the workflow/check names present on docs-only PRs so future
          # required checks do not stay pending when a whole workflow is filtered out.
          if [[ "$EVENT" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'go=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          git diff --name-only -z "$BASE_SHA" HEAD > changed-paths.txt
          run_go=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*.go|docs/*/testdata/*) run_go=true; break ;;
              docs/*|briefs/*|*.md) ;;
              *) run_go=true; break ;;
            esac
          done < changed-paths.txt
          echo "go=$run_go" >> "$GITHUB_OUTPUT"
          echo "Go checks needed: $run_go" >> "$GITHUB_STEP_SUMMARY"

  gofmt:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip Go work for documentation-only changes
        if: needs.changes.outputs.go != 'true'
        run: echo 'Documentation/briefs only; 0 Go packages run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.go == 'true'
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check formatting (including files behind build tags)
        if: needs.changes.outputs.go == 'true'
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -l > gofmt.txt
          if [[ -s gofmt.txt ]]; then
            cat gofmt.txt
            echo 'Run gofmt on the files listed above.' >&2
            exit 1
          fi

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip Go work for documentation-only changes
        if: needs.changes.outputs.go != 'true'
        run: echo 'Documentation/briefs only; 0 Go packages run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.go == 'true'
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build (without FFI)
        if: needs.changes.outputs.go == 'true'
        run: make build

  vet:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip Go work for documentation-only changes
        if: needs.changes.outputs.go != 'true'
        run: echo 'Documentation/briefs only; 0 Go packages run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.go == 'true'
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Vet all packages
        if: needs.changes.outputs.go == 'true'
        run: |
          go list ./... > packages.txt
          echo "Vet: $(wc -l < packages.txt) packages" >> "$GITHUB_STEP_SUMMARY"
          go vet ./... 2>&1 | tee vet.log
      - name: Upload vet failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vet-failure
          path: |
            vet.log
            packages.txt
          retention-days: 7

  test:
    needs: changes
    name: Test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Skip Go work for documentation-only changes
        if: needs.changes.outputs.go != 'true'
        run: echo 'Documentation/briefs only; 0 Go packages run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.go == 'true'
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Select packages
        if: needs.changes.outputs.go == 'true'
        run: |
          go list ./... > all-packages.txt
          python3 scripts/ci-packages.py '${{ matrix.shard }}' < all-packages.txt > packages.txt
          {
            echo "### Shard ${{ matrix.shard }}/4: $(wc -l < packages.txt) of $(wc -l < all-packages.txt) packages"
            echo '<details><summary>Package list</summary>'
            echo
            cat packages.txt
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test (without FFI)
        if: needs.changes.outputs.go == 'true'
        run: |
          mapfile -t packages < packages.txt
          go test "${packages[@]}" -json -count=1 -timeout 30m 2>&1 | tee test-log.json
      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-shard-${{ matrix.shard }}-failure
          path: |
            test-log.json
            packages.txt
            all-packages.txt
          retention-days: 7

  race:
    needs: changes
    name: Race (fast unit packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip Go work for documentation-only changes
        if: needs.changes.outputs.go != 'true'
        run: echo 'Documentation/briefs only; 0 Go packages run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.go == 'true'
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Select race packages
        if: needs.changes.outputs.go == 'true'
        run: |
          go list ./... > all-packages.txt
          python3 scripts/ci-packages.py race < all-packages.txt > packages.txt
          {
            echo "### Race: $(wc -l < packages.txt) packages"
            cat packages.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test with the race detector
        if: needs.changes.outputs.go == 'true'
        run: |
          mapfile -t packages < packages.txt
          go test "${packages[@]}" -race -json -count=1 -timeout 15m 2>&1 | tee test-log.json
      - name: Upload race failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: race-failure
          path: |
            test-log.json
            packages.txt
          retention-days: 7


  # evm-shard-chaos and evm-shard-compose-e2e are the "compose E2E" and live-fault-injection legs
  # of docs/engine-api-adapter-plan.md T1.7 — the test shards above already cover unit tests, the
  # executortest conformance suite, and the determinism harness (shardnode/determinism_test.go) as
  # part of `go test ./...`; these two exercise the process-based and container-based shard
  # topologies respectively, which `go test` alone doesn't reach. Both run against
  # `--executor fake` only — neither has a reth image to test against; see
  # docs/engine-api-adapter-plan.md §10 and scripts/reth-by-hand.sh.
  # These are fake-executor evidence. Real execution is covered separately by
  # reth-smoke.yml and reth-fault.yml, which this change leaves untouched.
  # Process/container lanes remain available on manual dispatch. Every PR runs the full Go suite.
  evm-shard-chaos:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: kill-leader / kill-follower / cold-restart / corrupted-store scenarios
        # 7, not 4: a restarted validator is non-voting until #105 (see VALIDATOR COUNT in
        # scripts/chaos-evm.sh), so the three restart scenarios need a shard that can lose three
        # voters and keep quorum.
        run: ./scripts/chaos-evm.sh -v 7 -k

      # The intermittent leader-kill stall and the same-partition-round certificate conflict
      # cannot be settled from the truncated snippets in the step log (F1 #9, review 5132493933).
      # Keep the full node logs and persisted state from a failing run so the next occurrence can
      # be analysed instead of re-guessed. -k above stops the script from tearing test-nodes/ down.
      - name: Collect node logs and state on failure
        if: failure()
        run: |
          mkdir -p chaos-artifacts
          for d in test-nodes/*/; do
            name=$(basename "$d")
            mkdir -p "chaos-artifacts/$name"
            # Logs plus the persisted certificate store: the stored UC is half of every
            # conflict comparison and cannot be reconstructed from the log alone.
            # keys.json is excluded on purpose. These are throwaway devnet keys regenerated every
            # run, but publishing signing keys as a build artifact is not a habit worth forming,
            # and nothing in this analysis needs them — node-info.json carries the public identity.
            cp "$d"debug.log "chaos-artifacts/$name/" 2>/dev/null || true
            find "$d" -maxdepth 1 -type f ! -name 'debug.log' ! -name 'pid' ! -name 'keys.json' \
              -exec cp {} "chaos-artifacts/$name/" \; 2>/dev/null || true
          done
          tar czf chaos-artifacts.tar.gz chaos-artifacts
          echo "collected:"; du -sh chaos-artifacts.tar.gz

      - name: Upload chaos failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-failure-evidence
          path: chaos-artifacts.tar.gz
          retention-days: 14

      - name: Stop nodes
        if: always()
        run: ./stop-evm.sh -a || true

  evm-shard-compose-e2e:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the EVM shard topology
        run: docker compose -f docker-compose.evm.yml up --build -d root1 root2 root3 evm1 evm2 evm3 evm4
      - name: Wait for the shard to certify
        run: |
          for i in $(seq 1 24); do
            if docker compose -f docker-compose.evm.yml logs evm1 2>&1 | grep -q 'accepted certificate'; then
              echo "certifying"
              exit 0
            fi
            sleep 5
          done
          echo "no certificate observed within 120s" >&2
          docker compose -f docker-compose.evm.yml logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.evm.yml down -v
